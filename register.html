<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — CinemaHub</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="index.html" class="navbar-logo">CinemaHub</a>
    </nav>

    <main class="container auth-page">
      <div class="auth-card card">
        <h1 class="font-display">Create Account</h1>

        <div class="form-group">
          <label for="name-input">Name</label>
          <input type="text" id="name-input" required placeholder="John Doe" />
          <p class="field-error" id="name-error" hidden></p>
        </div>

        <div class="form-group">
          <label for="email-input">Email</label>
          <input
            type="email"
            id="email-input"
            required
            placeholder="johndoe@example.com"
          />
          <p class="field-error" id="email-error" hidden></p>
        </div>

        <div class="form-group">
          <label for="password-input">Password</label>
          <input
            type="password"
            id="password-input"
            required
            minlength="6"
            placeholder="••••••••"
          />
          <p class="field-error" id="password-error" hidden></p>
        </div>

        <div class="form-group">
          <label for="confirm-password-input">Confirm Password</label>
          <input
            type="password"
            id="confirm-password-input"
            required
            minlength="6"
            placeholder="••••••••"
          />
          <p class="field-error" id="confirm-password-error" hidden></p>
        </div>

        <p id="auth-error" class="auth-error" hidden></p>

        <button id="register-btn" class="btn btn-primary auth-submit">
          Create Account
        </button>

        <p class="auth-switch text-muted">
          Already have an account? <a href="login.html">Log in</a>
        </p>
      </div>
    </main>

    <script type="module" src="js/pages/register.js"></script>
  </body>
</html>
